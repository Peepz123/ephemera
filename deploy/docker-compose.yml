services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ephemera
      POSTGRES_PASSWORD: devonly
      POSTGRES_DB: ephemera
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ephemera"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ephemera
      MINIO_ROOT_PASSWORD: devonlydevonly
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
