[workspace]
resolver = "2"
members = ["crates/ephemera-core", "crates/ephemera-wire"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
ephemera-wire = { path = "crates/ephemera-wire" }

zeroize = { version = "1", features = ["zeroize_derive"] }
thiserror = "1"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
subtle = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
chacha20poly1305 = "0.10"
hex = "0.4"

[profile.release]
lto = true
codegen-units = 1
